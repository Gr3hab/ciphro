# Nur für die Einrichtung über die Kommandozeile (npx wrangler deploy im Ordner _dev/zaehler).
# Über das Cloudflare-Dashboard geht es ohne diese Datei, siehe ANLEITUNG.md.
name = "ciphro-zaehler"
main = "worker.js"
compatibility_date = "2026-11-01"
routes = [{ pattern = "zaehler.ciphro.eu", custom_domain = true }]

# Keine Protokolle einzelner Anfragen (die Datenschutzerklärung sagt: keine einzelnen Aufrufe gespeichert)
[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "ciphro-zaehler"
database_id = "HIER-DIE-ID-DER-DATENBANK-EINTRAGEN"

# Geheimer Schlüssel für /statistik: npx wrangler secret put STATISTIK_SCHLUESSEL
