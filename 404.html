<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seite nicht gefunden · CIPHRO</title>
<!-- GitHub Pages zeigt diese Seite bei jeder unbekannten Adresse, mit Status 404. Deshalb nur absolute Links. -->
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<style>
:root{--paper:#f2f4f7;--sheet:#fff;--line:#d2d9e3;--text:#17202e;--muted:#566074;--ink:#1f3fa6}
@media (prefers-color-scheme: dark){:root{--paper:#111715;--sheet:#19221f;--line:#2f3b37;--text:#e6ece8;--muted:#9ba7a2;--ink:#a5b9ff}}
body{margin:0;background:var(--paper);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
main{max-width:34rem;margin:0 auto;padding:40px 16px}
.brand{font:800 1.6rem/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:-.02em;color:var(--text);text-decoration:none}
.brand span{color:var(--ink)}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:16px;margin-top:20px}
.card p{margin:0 0 6px}
.card p:last-child{margin:0}
a{color:var(--ink);font-weight:700}
small{color:var(--muted)}
</style>
</head>
<body>
<main>
  <a class="brand" href="/"><span>CIPH</span>RO</a>
  <div class="card">
    <p><strong>Diese Seite gibt es nicht.</strong> <a href="/de/">Zum Rätsel</a></p>
    <p lang="en"><small>This page does not exist.</small> <a href="/en/">Play</a></p>
    <p lang="fr"><small>Cette page n’existe pas.</small> <a href="/fr/">Jouer</a></p>
    <p lang="it"><small>Questa pagina non esiste.</small> <a href="/it/">Gioca</a></p>
  </div>
</main>
</body>
</html>
